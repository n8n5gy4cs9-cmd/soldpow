name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev pkg-config
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: nordSoldPow-${{ matrix.os }}
          path: |
            target/release/nordsoldpow
            target/release/nordsoldpow.exe
            assets
