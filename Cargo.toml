[package]
name = "nordsoldpow"
version = "0.1.0"
edition = "2021"
authors = ["Crowelian 2026 + Sonnet"]
description = "nordSoldPow - Powder Toy x Soldat in Nordic / Kalevala myth"
license = "MIT"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
